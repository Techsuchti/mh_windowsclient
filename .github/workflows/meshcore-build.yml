name: MeshCore Build

on:
  push:
    branches:
      - feature/meshcore-client
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MeshCore Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj

      - name: Build
        run: dotnet build MeshhessenClient/MeshhessenClient.csproj --configuration Release --no-restore
