name: MeshCore Build

on:
  push:
    branches:
      - feature/meshcore-client
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MeshCore Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj

      - name: Build
        run: dotnet build MeshhessenClient/MeshhessenClient.csproj --configuration Release --no-restore
