name: Build & Release

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MeshhessenClient.sln

      - name: Test
        run: dotnet test MeshhessenClient.sln -c Release --no-restore --verbosity normal

  build:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj

      - name: Publish standalone EXE
        run: dotnet publish MeshhessenClient/MeshhessenClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish_output

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MeshCore Windows Client ${{ github.ref_name }}
          body: |
            ## MeshCore Windows Client ${{ github.ref_name }}

            Native Windows client for MeshCore Companion radios.

            ### Current transport
            - MeshCore Companion over USB/Serial
            - 115200 baud default
            - Contacts, channels and channel messaging
            - MeshCore Companion startup synchronization

            ### Planned
            - BLE Companion
            - TCP Companion
            - Direct messages
            - Repeater and Room Server management
            - KISS modem protocol

            ### Requirements
            - Windows 10/11 x64
            - MeshCore Companion firmware
            - USB/Serial connection for the current release
          files: publish_output/MeshCoreWindowsClient.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
