name: Build & Release

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        run: dotnet restore MeshhessenClient.sln
      - name: Test MeshCore client
        run: dotnet test MeshhessenClient.Tests/MeshhessenClient.Tests.csproj -c Release --no-restore --verbosity normal

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore client
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj
      - name: Build client
        run: dotnet build MeshhessenClient/MeshhessenClient.csproj -c Release --no-restore
      - name: Publish standalone EXE
        run: dotnet publish MeshhessenClient/MeshhessenClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish_output
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshCoreWindowsClient-win-x64
          path: publish_output/MeshCoreWindowsClient.exe
          if-no-files-found: error
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MeshCore Windows Client ${{ github.ref_name }}
          body: |
            ## MeshCore Windows Client ${{ github.ref_name }}

            Native Windows client for MeshCore Companion radios.

            ### Transports
            - MeshCore Companion over USB/Serial
            - MeshCore Companion over BLE
            - MeshCore Companion over TCP streams

            ### Current features
            - Companion startup synchronization
            - Device and self information
            - Contact synchronization
            - Channel synchronization
            - Channel messaging
            - Direct-message command support
            - KISS codec foundation
          files: publish_output/MeshCoreWindowsClient.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
