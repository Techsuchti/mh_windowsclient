name: Build & Release

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        run: dotnet restore MeshhessenClient.sln
      - name: Test MeshCore client
        run: dotnet test MeshhessenClient.Tests/MeshhessenClient.Tests.csproj -c Release --no-restore --verbosity normal

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Restore client
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj
      - name: Build client
        run: dotnet build MeshhessenClient/MeshhessenClient.csproj -c Release --no-restore
      - name: Publish standalone EXE
        run: dotnet publish MeshhessenClient/MeshhessenClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish_output
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeshCoreWindowsClient-win-x64
          path: publish_output/MeshCoreWindowsClient.exe
          if-no-files-found: error
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/feature/meshcore-client'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0.1.0-alpha.1
          name: MeshCore Windows Client v0.1.0-alpha.1
          body: |
            ## MeshCore Windows Client v0.1.0-alpha.1

            First public test build of the native MeshCore Windows client.

            ### Platform
            - Windows 10/11 x64
            - Self-contained .NET 8 build
            - No .NET installation required

            ### Current features
            - MeshCore Companion startup synchronization
            - Device and self information
            - Contact synchronization
            - Channel synchronization
            - Channel messaging
            - Direct-message command support
            - KISS codec foundation
            - MeshCore node map foundation

            ⚠️ Early alpha test build. Please report startup/runtime problems and UI issues.
          files: publish_output/MeshCoreWindowsClient.exe
          draft: false
          prerelease: true
